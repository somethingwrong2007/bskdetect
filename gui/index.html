<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSK Detect - Basketball Analytics</title>
<link rel="stylesheet" href="/gui/style.css">
</head>
<body>
<!-- Header -->
<header class="app-header">
  <div class="brand">
    <div class="logo">🏀</div>
    <div>
      <h1>BSK Detect</h1>
      <span class="tagline">Real-time Basketball Analytics</span>
    </div>
  </div>
  
  <div class="header-actions">
    <input type="text" id="path" placeholder="视频路径 (e.g. E:\videos\game.mp4)" />
    <button id="btn-add" class="btn btn-primary">导入视频</button>
    <button id="btn-refresh" class="btn btn-icon" title="刷新">↻</button>
  </div>
</header>

<!-- Main Layout -->
<main class="dashboard">
  <!-- Left Sidebar -->
  <aside class="sidebar-left">
    <!-- Video List -->
    <section class="panel">
      <h2><span class="icon">📹</span> 视频库</h2>
      <div id="videos" class="video-grid"></div>
    </section>
    
    <!-- Layer Controls -->
    <section class="panel">
      <h2><span class="icon">🎨</span> 图层控制</h2>
      <div id="layers" class="layer-chips"></div>
    </section>
    
    <!-- Display Settings -->
    <section class="panel">
      <h2><span class="icon">⚙️</span> 显示设置</h2>
      <label class="control-row">
        <span>宽度</span>
        <input id="width" type="range" min="480" max="1920" step="80" value="1280">
        <span id="width-v" class="value-badge">1280</span>
      </label>
      
      <label class="control-row">
        <span>质量</span>
        <input id="quality" type="range" min="40" max="95" step="5" value="72">
        <span id="quality-v" class="value-badge">72</span>
      </label>
    </section>
  </aside>

  <!-- Center Stage -->
  <section class="main-stage">
    <!-- Video Viewer -->
    <div class="viewer-container">
      <img id="frame" alt="Video Frame" draggable="false">
      <canvas id="view3d" style="display:none;"></canvas>
      <div id="busy" class="loading-overlay hidden">
        <div class="spinner"></div>
        <span>处理中...</span>
      </div>
      <button id="btn-toggle-3d" class="floating-btn" title="切换3D视图">3D</button>
      
      <!-- Overlay Info -->
      <div class="frame-info">
        <span id="frame-counter">Frame: 1 / 8574</span>
        <span id="timecode">00:00.000</span>
      </div>
    </div>
    
    <!-- Playback Controls -->
    <div class="playback-bar">
      <button id="btn-play" class="btn btn-play">▶ 播放</button>
      
      <div class="scrub-container">
        <button data-step="-30" class="btn btn-sm">-30</button>
        <button data-step="-10" class="btn btn-sm">-10</button>
        <button data-step="-1" class="btn btn-sm">-1</button>
        <input id="frame-no" type="number" min="1" value="1" class="frame-input">
        <button data-step="1" class="btn btn-sm">+1</button>
        <button data-step="10" class="btn btn-sm">+10</button>
        <button data-step="30" class="btn btn-sm">+30</button>
      </div>
      
      <div class="speed-control">
        <span>速度</span>
        <select id="speed" class="select">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </div>
      
      <button id="btn-shot-prev" class="btn btn-icon" title="上一镜头">◀</button>
      <button id="btn-shot-next" class="btn btn-icon" title="下一镜头">▶</button>
    </div>
    
    <!-- Timeline Scrubber -->
    <input id="scrub" type="range" min="1" max="10" value="1" class="timeline-scrub">
  </section>

  <!-- Right Sidebar -->
  <aside class="sidebar-right">
    <!-- Real-time Stats -->
    <section class="panel panel-stats">
      <h2><span class="icon">📊</span> 实时统计</h2>
      <div id="stats" class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-players">0</div>
          <div class="stat-label">球员</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-balls">0</div>
          <div class="stat-label">篮球</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-fps">0</div>
          <div class="stat-label">FPS</div>
        </div>
      </div>
    </section>
    
    <!-- Frame Data -->
    <section class="panel">
      <h2><span class="icon">📋</span> 帧数据</h2>
      <div id="meta" class="kv-list"></div>
    </section>
    
    <!-- Detection Tables -->
    <section class="panel">
      <h2><span class="icon">🔍</span> 检测结果</h2>
      <div id="tables" class="data-tables"></div>
    </section>
  </aside>
</main>

<!-- Toast Notifications -->
<div id="toast-container" class="toast-container"></div>

<!-- Scripts -->
<script src="/gui/app.js?v=2"></script>
<script src="/gui/view3d.js"></script>
</body>
</html>
